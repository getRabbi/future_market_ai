# FUTUREGROW external uptime monitor (Cloudflare Workers free plan: cron triggers + one KV key).
# Deployed 2026-10-30; redeploy with DEPLOYMENT.md §9. No route and no workers.dev URL: it only runs on cron.
name = "futuregrow-uptime"
main = "src/index.ts"
compatibility_date = "2026-09-15"
workers_dev = false
preview_urls = false

# Workers Logs (free plan: 200k events/day, 3-day retention) keep each run's checks, and any alert
# that has no webhook to go to, visible in the dashboard.
[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
WEB_URL = "https://futuregrow.scalemyprints.com"
API_URL = "https://http--api--mjmcf2c5fbyt.code.run"
ENVIRONMENT = "production futuregrow.scalemyprints.com"

# Namespace futuregrow-uptime-state (created with: npx wrangler@4.147.0 kv namespace create futuregrow-uptime-state).
# ALERT_WEBHOOK_URL is a secret: wrangler secret put ALERT_WEBHOOK_URL. Unset, alerts are only logged.
[[kv_namespaces]]
binding = "STATE"
id = "5a481343650440a0b2f84aeda51caffb"
