# Cloudflare Pages project for the web control plane (D-013). Build: npm run build -w @futuregrow/web
# Deploy: npx wrangler pages deploy (from apps/web). Functions in ./functions proxy /v1 and /api/auth.
name = "futuregrow-web"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-15"

[vars]
# Northflank API origin for the same-origin proxy (https only). Leave the proxy unused by setting
# PUBLIC_API_BASE at build time when app.<domain> and api.<domain> share a registrable domain.
API_ORIGIN = "https://api.example.com"
